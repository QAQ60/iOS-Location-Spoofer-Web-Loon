#!name=iOS Location Spoofer (Loon)
#!desc=拦截 Apple WLOC 定位响应并替换为自定义坐标（Loon 适配版）
#!author=akudamatata

[Script]
response if ${url} ~= /^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc(?:[?#].*)?$/i then script("https://你的域名/location-spoofer.js", "mode=response&configUrl=https://你的域名/loc.json?token=你的Token") with tag="iOS Location Spoofer", timeout=30, requires_body=true, binary_body_mode=true, enable=true

[MITM]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com
skip-server-cert-verify = false
