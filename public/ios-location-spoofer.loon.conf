#!name=iOS Location Spoofer (Loon)
#!desc=拦截 Apple WLOC 定位响应并替换为自定义坐标（Loon 适配版）
#!author=akudamatata

[Script]
http-response ^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc(?:\?.*)?$ script-path=https://你的域名/location-spoofer.js,tag=iOS Location Spoofer,requires-body=true,binary-body-mode=true,timeout=30,argument="configUrl=https://你的域名/loc.json?token=你的Token",enable=true

[MITM]
hostname = gs-loc.apple.com,gs-loc-cn.apple.com,gsp-ssl.ls.apple.com,bluedot.is.autonavi.com,bluedot.is.autonavi.com.gds.alibabadns.com
